<div class="login-page">
  <section class="hero">
    <img src="/logo-hero.jpg" alt="Shivohum Group" class="hero-logo" />
    <p class="eyebrow">Construction Tracker</p>
    <h1>Track every site rupee without Excel.</h1>
    <p>Income, labour, material, and client payments for all projects — in one shared ledger.</p>
  </section>

  <section class="login-card">
    <h2>Sign in</h2>
    <p class="hint">Default admin: <strong>admin</strong> / <strong>Admin&#64;123</strong></p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Username
        <input formControlName="username" autocomplete="username" />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button class="btn primary" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</div>
