<section class="page-head">
  <div>
    <p class="eyebrow">Ledger</p>
    <h1>{{ isEdit ? 'Edit transaction' : 'Add transaction' }}</h1>
  </div>
  <a routerLink="/transactions" class="btn">Back to list</a>
</section>

<form class="card form-grid" [formGroup]="form" (ngSubmit)="submit()">
  <label>
    Date
    <input type="date" formControlName="transactionDate" />
  </label>
  <label>
    Type
    <select formControlName="type">
      <option value="Income">Income</option>
      <option value="Expense">Expense</option>
    </select>
  </label>
  <label>
    Category
    <select formControlName="categoryId">
      @for (category of categories; track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
  </label>
  <label>
    Amount (₹)
    <input type="number" min="0.01" step="0.01" formControlName="amount" />
  </label>
  <label class="wide">
    Description
    <input formControlName="description" placeholder="Labour tea, client payment, material…" />
  </label>
  <label>
    Project
    <select formControlName="projectId">
      <option value="">No project / office</option>
      @for (project of projects; track project.projectId) {
        <option [value]="project.projectId">{{ project.projectName }}</option>
      }
    </select>
  </label>
  <label>
    Payment mode
    <select formControlName="paymentModeId">
      @for (mode of paymentModes; track mode.id) {
        <option [value]="mode.id">{{ mode.name }}</option>
      }
    </select>
  </label>
  <label>
    Account / fund
    <select formControlName="accountId">
      <option value="">Not specified</option>
      @for (account of accounts; track account.id) {
        <option [value]="account.id">{{ account.name }}</option>
      }
    </select>
  </label>
  <label class="wide">
    Notes
    <input formControlName="notes" placeholder="Optional remark" />
  </label>

  @if (error) {
    <p class="error wide">{{ error }}</p>
  }

  <div class="wide actions">
    <button class="btn primary" type="submit" [disabled]="saving">
      {{ saving ? 'Saving…' : (isEdit ? 'Save changes' : 'Save transaction') }}
    </button>
  </div>
</form>
